name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --check internal/webcontrol/web/app.js
      - run: node scripts/test-web-frame-pump.mjs
      - run: node scripts/test-web-direct-transport.mjs
      - run: node scripts/test-web-layout.mjs
      - run: bash scripts/test-setup-gadget.sh
      - run: GOOS=linux GOARCH=arm GOARM=7 go build ./cmd/kvmctl
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/kvmctl
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/kvmctl
