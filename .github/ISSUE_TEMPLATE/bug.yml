name: 缺陷报告
description: 报告可复现的 kvmctl 问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先移除密钥、主机地址和敏感截图。
  - type: input
    id: hardware
    attributes:
      label: 硬件与连接方式
      description: 板卡、采集设备、USB 连接拓扑
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统环境
      description: 发行版、内核版本、kvmctl 版本或提交
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与脱敏日志
    validations:
      required: true
