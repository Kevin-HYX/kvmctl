name: 功能建议
description: 建议新能力或硬件适配
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请描述要解决的问题，而不只是预设实现。
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: 相关硬件或平台
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的完成标准
    validations:
      required: true
